
name: Update Airthings Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-airthings.yml"

permissions:
  contents: write

concurrency:
  group: airthings-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Retrieve Airthings readings
        env:
          AIRTHINGS_CLIENT_ID: ${{ secrets.AIRTHINGS_CLIENT_ID }}
          AIRTHINGS_CLIENT_SECRET: ${{ secrets.AIRTHINGS_CLIENT_SECRET }}
        run: python update_airthings.py

      - name: Save updated readings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add airthings-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Airthings sensor readings"
            git push
          else
            echo "No changes to save"
          fi
