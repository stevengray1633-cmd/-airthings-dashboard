
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="300">

<title>DELUXE | Airthings Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  background: #101827;
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
}

/* HEADER */
.dashboard-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 24px;
  min-height: 155px;
}

.header-title h1 {
  color: #ff003b;
  font-family: 'Poppins', Arial, sans-serif;
  font-size: 47.5px;
  font-weight: 900;
  letter-spacing: -2px;
  line-height: 1.1;
  margin: 0 0 5px;
}

.subtitle {
  color: #9ac8ff;
  font-size: 15px;
}

.facilities-logo {
  width: 147.5px;
  height: 147.5px;
  object-fit: contain;
  mix-blend-mode: screen;
  flex-shrink: 0;
}

/* DEVICE PANELS */
.device {
  display: grid;
  grid-template-columns: 215px repeat(6, minmax(0, 1fr));
  align-items: center;
  background: #202e43;
  border-radius: 17px;
  padding: 18px 15px;
  margin-bottom: 15px;
  min-height: 125px;
}

.device-info {
  padding: 10px 16px;
}

.device-name {
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 7px;
}

.device-type {
  font-size: 13px;
  color: #9ac8ff;
}

.metric {
  text-align: center;
  border-left: 1px solid #40516a;
  padding: 12px 5px;
  min-width: 0;
}

.metric-label {
  color: #9ac8ff;
  font-size: 13px;
  margin-bottom: 9px;
}

.metric-reading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 24px;
  font-weight: bold;
}

.metric-icon {
  color: #8fc5ff;
  font-size: 22px;
  line-height: 1;
}

.metric-unit {
  font-size: 12px;
  color: #9ac8ff;
  margin-top: 7px;
}

.good {
  color: #32dba0;
}

.moderate {
  color: #ffc83d;
}

.high {
  color: #ff6575;
}

.normal {
  color: #ffffff;
}

/* FOOTER */
.footer {
  color: #9ac8ff;
  font-size: 12px;
  margin-top: 25px;
  line-height: 1.8;
}

.error {
  padding: 25px;
  color: #ff6575;
}

/* SMALLER SCREENS */
@media (max-width: 1100px) {
  .device {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }

  .device-info {
    grid-column: 1 / -1;
  }

  .metric {
    border-left: none;
    border-top: 1px solid #40516a;
  }
}

@media (max-width: 550px) {
  .device {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .header-title h1 {
    font-size: 37.5px;
  }

  .facilities-logo {
    width: 112.5px;
    height: 112.5px;
  }
}
</style>
</head>

<body>

<header class="dashboard-header">
  <div class="header-title">
    <h1>DELUXE</h1>
    <div class="subtitle">
      Airthings Air Quality Dashboard
    </div>
  </div>

  <img
    src="deluxe-facilities-logo.png"
    alt="Deluxe Facilities"
    class="facilities-logo"
  >
</header>

<main id="devices">
  Loading Airthings sensor readings...
</main>

<footer class="footer">
  <div id="lastUpdate">Loading update time...</div>
  <div id="connection">Connecting to Airthings data...</div>
</footer>

<script>
const icons = {
  co2: "☁",
  voc: "≋",
  temp: "♧",
  humidity: "♧",
  radon: "☢",
  pressure: "◉",
  pm25: "⠿"
};

function number(value, decimals = 0) {
  const n = Number(value);
  return value != null && Number.isFinite(n)
    ? n.toFixed(decimals)
    : "--";
}

function co2Colour(value) {
  if (value == null) return "normal";
  if (value < 800) return "good";
  if (value < 1200) return "moderate";
  return "high";
}

function humidityColour(value) {
  if (value == null) return "normal";
  if (value >= 30 && value <= 60) return "good";
  if (value >= 25 && value <= 65) return "moderate";
  return "high";
}

function metric(label, icon, value, unit, colour = "normal") {
  return `
    <div class="metric">
      <div class="metric-label">${label}</div>
      <div class="metric-reading">
        <span class="metric-icon">${icon}</span>
        <span class="${colour}">${value}</span>
      </div>
      <div class="metric-unit">${unit}</div>
    </div>
  `;
}

function deviceType(data) {
  const type = data?.relayDeviceType;
  return type === "hub" ? "View Plus" : "Wave Plus";
}

function escapeHTML(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function renderDevice(device) {
  const data = device.readings?.data || {};
  const name = device.name || "Airthings Device";

  const co2 = data.co2;
  const voc = data.voc;
  const temp = data.temp;
  const humidity = data.humidity;
  const radon = data.radonShortTermAvg;

  const lastMetric = data.pm25 != null
    ? metric(
        "PM2.5",
        icons.pm25,
        number(data.pm25, 1),
        "µg/m³"
      )
    : metric(
        "Pressure",
        icons.pressure,
        number(data.pressure),
        "mbar"
      );

  return `
    <section class="device">
      <div class="device-info">
        <div class="device-name">${escapeHTML(name)}</div>
        <div class="device-type">${deviceType(data)}</div>
      </div>

      ${metric(
        "CO₂",
        icons.co2,
        number(co2),
        "ppm",
        co2Colour(co2)
      )}

      ${metric(
        "VOCs",
        icons.voc,
        number(voc),
        "ppb"
      )}

      ${metric(
        "Temperature",
        icons.temp,
        number(temp, 1),
        "°C"
      )}

      ${metric(
        "Humidity",
        icons.humidity,
        number(humidity),
        "%",
        humidityColour(humidity)
      )}

      ${metric(
        "Radon",
        icons.radon,
        number(radon),
        "Bq/m³"
      )}

      ${lastMetric}
    </section>
  `;
}

async function loadAirthings() {
  const container = document.getElementById("devices");
  const connection = document.getElementById("connection");
  const lastUpdate = document.getElementById("lastUpdate");

  try {
    const response = await fetch(
      "airthings-data.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Unable to retrieve Airthings data");
    }

    const result = await response.json();
    const devices = Object.values(result.devices || {});

    if (devices.length === 0) {
      throw new Error("No Airthings devices found");
    }

    container.innerHTML = devices
      .map(renderDevice)
      .join("");

    if (result.updated) {
      const date = new Date(result.updated);

      lastUpdate.textContent =
        "Last sensor update: " +
        (Number.isNaN(date.getTime())
          ? result.updated
          : date.toLocaleString("en-GB"));
    } else {
      lastUpdate.textContent =
        "Last sensor update: Not available";
    }

    connection.textContent =
      "Airthings data connected • " +
      devices.length +
      " devices";

  } catch (error) {
    container.innerHTML =
      '<div class="error">Unable to load sensor readings.</div>';

    connection.textContent =
      "Airthings data connection error";

    console.error(error);
  }
}

loadAirthings();
setInterval(loadAirthings, 60000);
</script>

</body>
</html>
