
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="300">
<title>DELUXE | Airthings Dashboard</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px;
  background: #101827;
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
}

header { margin-bottom: 30px; }

h1 {
  font-size: 42px;
  margin: 0;
  letter-spacing: 2px;
  font-weight: bold;
  color: #E2231A;
}

.subtitle {
  color: #a9c8f7;
  margin-top: 6px;
}

.device {
  display: grid;
  grid-template-columns: 250px repeat(6, minmax(0, 1fr));
  background: #202e43;
  border-radius: 17px;
  padding: 22px 15px;
  margin-bottom: 20px;
  align-items: center;
}

.device-info { padding: 10px; }

.device-name {
  font-size: 21px;
  font-weight: bold;
}

.device-type {
  color: #a9c8f7;
  margin-top: 7px;
}

.metric {
  text-align: center;
  border-left: 1px solid #40516a;
  padding: 12px 5px;
  min-width: 0;
}

.metric-label {
  color: #a9c8f7;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  white-space: nowrap;
}

.metric-icon {
  width: 23px;
  height: 23px;
  stroke: #91b2d0;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

.metric-value {
  font-size: 29px;
  font-weight: bold;
  margin: 15px 0 8px;
}

.metric-unit {
  font-size: 13px;
  color: #c6d7ef;
}

.good { color: #56df9b; }
.moderate { color: #ffd166; }
.high { color: #ff7777; }

footer {
  color: #a9c8f7;
  margin-top: 25px;
  font-size: 14px;
}

#status { margin-top: 8px; }

@media (max-width: 1050px) {
  .device {
    grid-template-columns: repeat(3, 1fr);
  }
  .device-info { grid-column: 1 / -1; }
  .metric:nth-child(2),
  .metric:nth-child(5) { border-left: none; }
}

@media (max-width: 550px) {
  body { padding: 12px; }
  .device { grid-template-columns: repeat(2, 1fr); }
  .metric:nth-child(5) {
    border-left: 1px solid #40516a;
  }
  .metric:nth-child(even) { border-left: none; }
  .metric-value { font-size: 24px; }
  .metric-label { font-size: 12px; gap: 4px; }
  .metric-icon { width: 19px; height: 19px; }
}
</style>
</head>

<body>

<header>
  <h1>DELUXE</h1>
  <div class="subtitle">
    Airthings Air Quality Dashboard
  </div>
</header>

<main id="dashboard"></main>

<footer>
  <div id="updated">Waiting for sensor data...</div>
  <div id="status">Connecting to Airthings data...</div>
</footer>

<script>

// Self-contained SVG icons.
// No external icon libraries are required.

const icons = {
  co2: `<path d="M7 18h11a4 4 0 0 0 .2-8
    6 6 0 0 0-11.5-1.5A4.8 4.8 0 0 0 7 18Z"/>`,

  voc: `<path d="M3 8h12a3 3 0 1 0-3-3"/>
        <path d="M2 12h18a3 3 0 1 1-3 3"/>
        <path d="M4 16h7a3 3 0 1 1-3 3"/>`,

  temp: `<path d="M14 14.8V5a3 3 0 0 0-6 0v9.8
    a5 5 0 1 0 6 0Z"/>
    <path d="M11 9v9"/>
    <circle cx="11" cy="18" r="1"/>`,

  humidity: `<path d="M12 2C9 6 5 10.5 5 15
    a7 7 0 0 0 14 0c0-4.5-4-9-7-13Z"/>
    <path d="M9 16a3 3 0 0 0 3 3"/>`,

  radon: `<circle cx="12" cy="12" r="2"/>
    <path d="M10.8 8.2 8 3H5L2 8l5.5 2"/>
    <path d="m15.2 8.2 2.8-5.2h3l3 5-5.5 2"
      transform="translate(-2 0)"/>
    <path d="m9 15-3 5 3 2h6l-1-6"/>`,

  pressure: `<path d="M4.9 18a9 9 0 1 1 14.2 0"/>
    <path d="m12 13 5-5"/>
    <circle cx="12" cy="13" r="1.5"/>
    <path d="M6 20h12"/>`,

  pm25: `<circle cx="6" cy="6" r="1.5"/>
    <circle cx="15" cy="5" r="2"/>
    <circle cx="20" cy="12" r="1.5"/>
    <circle cx="12" cy="12" r="2"/>
    <circle cx="5" cy="16" r="2"/>
    <circle cx="15" cy="20" r="1.5"/>`
};

function makeIcon(key) {
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");

  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("class", "metric-icon");
  svg.setAttribute("aria-hidden", "true");

  // Icon markup is defined locally, not from API data.
  svg.innerHTML = icons[key] || "";
  return svg;
}

const devices = [
  {
    id: "2930125849",
    name: "Airthings 1 DFX",
    type: "Wave Plus"
  },
  {
    id: "2960180535",
    name: "DH MFRs",
    type: "View Plus"
  },
  {
    id: "2960194763",
    name: "View Plus DFX",
    type: "View Plus"
  }
];

const metrics = [
  {
    label: "CO₂",
    key: "co2",
    unit: "ppm",
    digits: 0,
    icon: "co2"
  },
  {
    label: "VOCs",
    key: "voc",
    unit: "ppb",
    digits: 0,
    icon: "voc"
  },
  {
    label: "Temperature",
    key: "temp",
    unit: "°C",
    digits: 1,
    icon: "temp"
  },
  {
    label: "Humidity",
    key: "humidity",
    unit: "%",
    digits: 0,
    icon: "humidity"
  },
  {
    label: "Radon",
    key: "radonShortTermAvg",
    unit: "Bq/m³",
    digits: 0,
    icon: "radon"
  },
  {
    label: "Pressure",
    key: "pressure",
    unit: "mbar",
    digits: 0,
    icon: "pressure"
  }
];

function colour(key, value) {
  if (typeof value !== "number") return "";

  if (key === "co2") {
    return value < 800
      ? "good"
      : value < 1200
      ? "moderate"
      : "high";
  }

  if (key === "humidity") {
    return value >= 30 && value <= 60
      ? "good"
      : "moderate";
  }

  return "";
}

function displayValue(value, digits) {
  if (typeof value !== "number" ||
      !Number.isFinite(value)) {
    return "--";
  }
  return value.toFixed(digits);
}

function render(data) {
  const container = document.getElementById("dashboard");
  container.innerHTML = "";

  for (const device of devices) {
    const record = data.devices?.[device.id];
    const readings = record?.readings?.data || {};

    const section = document.createElement("section");
    section.className = "device";

    const info = document.createElement("div");
    info.className = "device-info";

    const name = document.createElement("div");
    name.className = "device-name";
    name.textContent = device.name;

    const type = document.createElement("div");
    type.className = "device-type";
    type.textContent = device.type;

    info.append(name, type);
    section.appendChild(info);

    const availableMetrics = [...metrics];

    // Display PM2.5 instead of pressure on View Plus.
    if (device.type === "View Plus") {
      availableMetrics[5] = {
        label: "PM2.5",
        key: "pm25",
        unit: "µg/m³",
        digits: 1,
        icon: "pm25"
      };
    }

    for (const metric of availableMetrics) {
      const tile = document.createElement("div");
      tile.className = "metric";

      const label = document.createElement("div");
      label.className = "metric-label";

      label.appendChild(makeIcon(metric.icon));

      const labelText = document.createElement("span");
      labelText.textContent = metric.label;
      label.appendChild(labelText);

      const value = document.createElement("div");
      value.className = "metric-value";

      value.textContent = displayValue(
        readings[metric.key],
        metric.digits
      );

      const valueColour = colour(
        metric.key,
        readings[metric.key]
      );

      if (valueColour) {
        value.classList.add(valueColour);
      }

      const unit = document.createElement("div");
      unit.className = "metric-unit";
      unit.textContent = metric.unit;

      tile.append(label, value, unit);
      section.appendChild(tile);
    }

    container.appendChild(section);
  }
}

async function loadData() {
  const status = document.getElementById("status");

  try {
    const response = await fetch(
      "./airthings-data.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();
    render(data);

    const updated = data.updated
      ? new Date(data.updated).toLocaleString(
          "en-GB",
          {
            dateStyle: "medium",
            timeStyle: "medium"
          }
        )
      : "Unknown";

    document.getElementById("updated").textContent =
      "Last sensor update: " + updated;

    status.textContent = "Airthings data connected";

  } catch (error) {
    status.textContent =
      "Unable to load Airthings data: " + error.message;
  }
}

// Load immediately.
loadData();

// Check for new readings every minute.
setInterval(loadData, 60000);

</script>
</body>
</html>
