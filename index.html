
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="300">
<title>DELUXE | Airthings Air Quality Dashboard</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    background: #101827;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 115px;
    margin-bottom: 20px;
}

.brand h1 {
    color: #ff003b;
    font-size: 52px;
    font-weight: 900;
    letter-spacing: -2px;
    margin: 0;
    line-height: 1.1;
}

.subtitle {
    color: #9ac8ff;
    font-size: 16px;
    margin-top: 7px;
}

.logo {
    width: 135px;
    height: 135px;
    object-fit: contain;
    mix-blend-mode: lighten;
}

.building-title {
    color: #ffffff;
    font-size: 32px;
    font-weight: 800;
    margin: 32px 0 18px;
}

.device {
    display: grid;
    grid-template-columns: 220px repeat(6, minmax(0, 1fr));
    align-items: center;
    background: #202e43;
    border-radius: 17px;
    padding: 20px 15px;
    margin-bottom: 14px;
    min-height: 125px;
}

.device-info {
    padding: 10px;
}

.device-name {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 7px;
}

.device-type {
    font-size: 13px;
    color: #9ac8ff;
}

.metric {
    text-align: center;
    border-left: 1px solid #40516a;
    padding: 10px 5px;
    min-width: 0;
}

.metric-label {
    color: #9ac8ff;
    font-size: 13px;
    margin-bottom: 8px;
}

.metric-value {
    font-size: 25px;
    font-weight: bold;
    color: #ffffff;
    white-space: nowrap;
}

.metric-icon {
    color: #8bc4ff;
    font-size: 21px;
    margin-right: 6px;
}

.metric-unit {
    color: #9ac8ff;
    font-size: 12px;
    margin-top: 7px;
}

.good { color: #32dba0; }
.moderate { color: #ffc83d; }
.high { color: #ff7777; }

footer {
    color: #9ac8ff;
    font-size: 13px;
    margin-top: 28px;
    line-height: 1.8;
}

@media (max-width: 1100px) {
    .device {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }

    .device-info {
        grid-column: 1 / -1;
    }

    .metric {
        border-left: none;
        border-top: 1px solid #40516a;
    }
}

@media (max-width: 600px) {
    .brand h1 { font-size: 38px; }
    .building-title { font-size: 25px; }
    .logo { width: 95px; height: 95px; }
    .device { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <h1>DELUXE</h1>
        <div class="subtitle">
            Airthings Air Quality Dashboard
        </div>
    </div>

    <img
        class="logo"
        src="deluxe-facilities-logo.png"
        alt="Deluxe Facilities Logo"
    >
</header>

<main id="dashboard">
    <div id="building-theobalds">
        <h2 class="building-title">98 Theobalds Road</h2>
        <div id="theobalds-devices"></div>
    </div>

    <div id="building-perivale">
        <h2 class="building-title">Deluxe House Perivale</h2>
        <div id="perivale-devices"></div>
    </div>
</main>

<footer>
    <div id="last-update">Loading sensor readings...</div>
    <div id="connection-status">Connecting to Airthings data...</div>
</footer>

<script>
const DATA_URL = "airthings-data.json";

const deviceGroups = {
    theobalds: [
        "Airthings 1 DFX",
        "View Plus DFX"
    ],
    perivale: [
        "DH MFRs"
    ]
};

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[c]);
}

function number(value, decimals = 0) {
    const n = Number(value);
    return Number.isFinite(n) ? n.toFixed(decimals) : "--";
}

function colour(metric, value) {
    const n = Number(value);
    if (!Number.isFinite(n)) return "";

    if (metric === "co2") {
        if (n < 800) return "good";
        if (n < 1200) return "moderate";
        return "high";
    }

    if (metric === "humidity") {
        if (n >= 30 && n <= 60) return "good";
        return "moderate";
    }

    return "";
}

function metric(label, value, unit, icon, colourClass = "") {
    return `
        <div class="metric">
            <div class="metric-label">${label}</div>
            <div class="metric-value ${colourClass}">
                <span class="metric-icon">${icon}</span>${value}
            </div>
            <div class="metric-unit">${unit}</div>
        </div>
    `;
}

function renderDevice(device) {
    const name = device.name || "Unknown device";
    const readings = device.readings?.data || {};

    const isViewPlus = name.toLowerCase().includes("view plus") ||
                       name.toLowerCase().includes("dh mfr");

    const co2 = readings.co2;
    const voc = readings.voc;
    const temp = readings.temp;
    const humidity = readings.humidity;
    const radon = readings.radonShortTermAvg;

    const lastMetric = isViewPlus
        ? metric(
            "PM2.5",
            number(readings.pm25, 1),
            "µg/m³",
            "⠿"
          )
        : metric(
            "Pressure",
            number(readings.pressure),
            "mbar",
            "◉"
          );

    return `
        <div class="device">
            <div class="device-info">
                <div class="device-name">${escapeHTML(name)}</div>
                <div class="device-type">
                    ${isViewPlus ? "View Plus" : "Wave Plus"}
                </div>
            </div>

            ${metric(
                "CO₂",
                number(co2),
                "ppm",
                "☁",
                colour("co2", co2)
            )}

            ${metric(
                "VOCs",
                number(voc),
                "ppb",
                "≋"
            )}

            ${metric(
                "Temperature",
                number(temp, 1),
                "°C",
                "♧"
            )}

            ${metric(
                "Humidity",
                number(humidity),
                "%",
                "♧",
                colour("humidity", humidity)
            )}

            ${metric(
                "Radon",
                number(radon),
                "Bq/m³",
                "☢"
            )}

            ${lastMetric}
        </div>
    `;
}

function findDevice(devices, name) {
    return devices.find(device =>
        device.name?.trim().toLowerCase() === name.toLowerCase()
    );
}

function renderGroup(devices, names) {
    return names.map(name => {
        const device = findDevice(devices, name);
        return device ? renderDevice(device) : "";
    }).join("");
}

async function updateDashboard() {
    try {
        const response = await fetch(
            DATA_URL + "?t=" + Date.now(),
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("Unable to load sensor data");
        }

        const data = await response.json();

        const devices = Object.values(data.devices || {});

        document.getElementById("theobalds-devices").innerHTML =
            renderGroup(devices, deviceGroups.theobalds);

        document.getElementById("perivale-devices").innerHTML =
            renderGroup(devices, deviceGroups.perivale);

        const updated = data.updated
            ? new Date(data.updated)
            : null;

        document.getElementById("last-update").textContent =
            "Last sensor update: " +
            (updated && !isNaN(updated)
                ? updated.toLocaleString("en-GB")
                : "Unknown");

        document.getElementById("connection-status").textContent =
            "Airthings data connected - " +
            devices.length + " devices";

    } catch (error) {
        document.getElementById("connection-status").textContent =
            "Unable to connect to Airthings data";
        console.error(error);
    }
}

updateDashboard();
setInterval(updateDashboard, 60000);
</script>

</body>
</html>
