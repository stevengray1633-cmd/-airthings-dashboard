
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="300">
<title>DELUXE | Airthings Dashboard</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px;
  background: #101827;
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
}

h1 {
  font-size: 42px;
  margin: 0;
  letter-spacing: 2px;
  font-weight: bold;
}

.subtitle {
  color: #aabed8;
  font-size: 19px;
  margin: 8px 0 35px;
}

.device {
  background: #202d40;
  border-radius: 18px;
  padding: 25px 20px;
  margin-bottom: 20px;
  display: grid;
  grid-template-columns: 250px 1fr;
  align-items: center;
  gap: 15px;
}

.device-info {
  padding-left: 5px;
}

.name {
  font-size: 22px;
  font-weight: bold;
}

.type {
  color: #aabed8;
  margin-top: 8px;
  font-size: 15px;
}

.readings {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 5px;
}

.metric {
  text-align: center;
  border-left: 1px solid #46546a;
  padding: 12px 5px;
  min-width: 0;
}

.label {
  color: #a9c9ee;
  font-size: 16px;
  white-space: nowrap;
}

.value {
  font-size: 36px;
  font-weight: bold;
  margin: 14px 0 7px;
}

.unit {
  color: #c6d4e7;
  font-size: 14px;
}

.status {
  color: #aabed8;
  margin-top: 30px;
  font-size: 14px;
}

@media (max-width: 1050px) {
  .device {
    grid-template-columns: 1fr;
  }

  .readings {
    grid-template-columns: repeat(3, 1fr);
  }
}

@media (max-width: 550px) {
  body {
    padding: 15px;
  }

  h1 {
    font-size: 32px;
  }

  .readings {
    grid-template-columns: repeat(2, 1fr);
  }

  .value {
    font-size: 30px;
  }
}
</style>
</head>

<body>

<header>
  <h1>DELUXE</h1>
  <div class="subtitle">
    Airthings Air Quality Dashboard
  </div>
</header>

<main id="devices"></main>

<footer class="status" id="status">
  Awaiting Airthings API connection
</footer>

<script>
const devices = [
  {
    id: "2930125849",
    name: "Airthings 1 DFX",
    type: "Wave Plus",
    metrics: [
      ["CO₂", "co2", "ppm"],
      ["VOCs", "voc", "ppb"],
      ["Temperature", "temperature", "°C"],
      ["Humidity", "humidity", "%"],
      ["Radon", "radon", "Bq/m³"],
      ["Pressure", "pressure", "mbar"]
    ]
  },
  {
    id: "2960180535",
    name: "DH MFRs",
    type: "View Plus",
    metrics: [
      ["CO₂", "co2", "ppm"],
      ["VOCs", "voc", "ppb"],
      ["Temperature", "temperature", "°C"],
      ["Humidity", "humidity", "%"],
      ["Radon", "radon", "Bq/m³"],
      ["PM2.5", "pm25", "µg/m³"]
    ]
  },
  {
    id: "2960194763",
    name: "View Plus DFX",
    type: "View Plus",
    metrics: [
      ["CO₂", "co2", "ppm"],
      ["VOCs", "voc", "ppb"],
      ["Temperature", "temperature", "°C"],
      ["Humidity", "humidity", "%"],
      ["Radon", "radon", "Bq/m³"],
      ["PM2.5", "pm25", "µg/m³"]
    ]
  }
];

const container = document.getElementById("devices");

devices.forEach(device => {
  const section = document.createElement("section");
  section.className = "device";

  const info = document.createElement("div");
  info.className = "device-info";

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = device.name;

  const type = document.createElement("div");
  type.className = "type";
  type.textContent = device.type;

  info.append(name, type);

  const readings = document.createElement("div");
  readings.className = "readings";

  device.metrics.forEach(([label, key, unit]) => {
    const metric = document.createElement("div");
    metric.className = "metric";

    const labelEl = document.createElement("div");
    labelEl.className = "label";
    labelEl.textContent = label;

    const valueEl = document.createElement("div");
    valueEl.className = "value";
    valueEl.id = "d" + device.id + "-" + key;
    valueEl.textContent = "--";

    const unitEl = document.createElement("div");
    unitEl.className = "unit";
    unitEl.textContent = unit;

    metric.append(labelEl, valueEl, unitEl);
    readings.appendChild(metric);
  });

  section.append(info, readings);
  container.appendChild(section);
});
</script>

</body>
</html>
