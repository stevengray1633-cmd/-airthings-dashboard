
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="300">
<title>DELUXE | Airthings Dashboard</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #101827;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

header {
  display: flex;
  align-items: center;
  gap: 24px;
  margin-bottom: 28px;
}

.facilities-logo {
  width: 135px;
  height: 135px;
  object-fit: contain;
  flex-shrink: 0;
}

h1 {
  font-size: 42px;
  color: #ff123e;
  letter-spacing: 2px;
  margin: 0;
}

.subtitle {
  color: #9ac8ff;
  font-size: 17px;
  margin-top: 5px;
}

.device {
  background: #202e43;
  border-radius: 17px;
  padding: 20px 15px;
  margin-bottom: 17px;
  display: grid;
  grid-template-columns: 230px repeat(6, minmax(0,1fr));
  align-items: center;
  gap: 0;
}

.device-info {
  padding: 10px 15px 10px 5px;
}

.device-name {
  font-size: 20px;
  font-weight: bold;
}

.device-type {
  color: #9ac8ff;
  font-size: 14px;
  margin-top: 7px;
}

.metric {
  text-align: center;
  padding: 12px 5px;
  border-left: 1px solid #40516a;
  min-width: 0;
}

.metric-label {
  font-size: 14px;
  color: #a6caff;
  margin-bottom: 12px;
}

.metric-reading {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 9px;
}

.metric-icon {
  font-size: 25px;
  color: #9ac8ff;
  line-height: 1;
}

.metric-value {
  font-size: 26px;
  font-weight: bold;
}

.metric-unit {
  font-size: 12px;
  margin-top: 7px;
  color: #a6caff;
}

.good { color: #36d99a; }
.moderate { color: #ffd05c; }
.high { color: #ff7777; }
.normal { color: #ffffff; }

footer {
  margin-top: 25px;
  color: #9ac8ff;
  font-size: 13px;
  line-height: 1.8;
}

@media(max-width:1100px) {
  .device {
    grid-template-columns: repeat(3,1fr);
  }

  .device-info {
    grid-column: 1 / -1;
  }

  .metric:nth-child(3n+2) {
    border-left: none;
  }
}

@media(max-width:600px) {
  body { padding: 12px; }

  header { gap: 12px; }

  .facilities-logo {
    width: 85px;
    height: 85px;
  }

  h1 { font-size: 29px; }

  .subtitle { font-size: 13px; }

  .device {
    grid-template-columns: repeat(2,1fr);
  }

  .metric {
    border-left: none;
    border-top: 1px solid #40516a;
  }

  .metric-value { font-size: 23px; }
}
</style>
</head>

<body>

<header>
  <img
    class="facilities-logo"
    src="deluxe-facilities-logo.png"
    alt="Deluxe Facilities Steven Gray"
  >
  <div>
    <h1>DELUXE</h1>
    <div class="subtitle">
      Airthings Air Quality Dashboard
    </div>
  </div>
</header>

<main id="devices">
  Loading Airthings sensor readings...
</main>

<footer>
  <div id="updated">Checking sensor data...</div>
  <div id="status">Connecting to Airthings data...</div>
</footer>

<script>
const icons = {
  co2: "☁",
  voc: "≋",
  temp: "♙",
  humidity: "♧",
  radon: "☢",
  pressure: "◉",
  pm25: "⠿"
};

function number(value, decimals = 0) {
  if (value === undefined ||
      value === null ||
      value === "") return "—";

  const n = Number(value);
  return Number.isFinite(n)
    ? n.toFixed(decimals)
    : "—";
}

function colour(type, value) {
  const n = Number(value);
  if (!Number.isFinite(n) || value == null)
    return "normal";

  if (type === "co2") {
    if (n < 800) return "good";
    if (n < 1200) return "moderate";
    return "high";
  }

  if (type === "humidity") {
    if (n >= 30 && n <= 60) return "good";
    if (n >= 20 && n <= 70) return "moderate";
    return "high";
  }

  if (type === "voc") {
    if (n < 250) return "normal";
    if (n < 1000) return "moderate";
    return "high";
  }

  return "normal";
}

function metric(label, icon, value, unit, type, decimals=0) {
  const displayValue = number(value, decimals);

  return `
    <div class="metric">
      <div class="metric-label">${label}</div>
      <div class="metric-reading">
        <span class="metric-icon">${icon}</span>
        <span class="metric-value ${colour(type,value)}">
          ${displayValue}
        </span>
      </div>
      <div class="metric-unit">${unit}</div>
    </div>
  `;
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

function renderDevice(device) {
  const d = device.readings?.data || {};
  const name = escapeHTML(device.name || "Airthings Device");

  const type = d.pm25 !== undefined
    ? "View Plus"
    : "Wave Plus";

  return `
    <section class="device">
      <div class="device-info">
        <div class="device-name">${name}</div>
        <div class="device-type">${type}</div>
      </div>

      ${metric("CO₂",icons.co2,d.co2,"ppm","co2")}
      ${metric("VOCs",icons.voc,d.voc,"ppb","voc")}
      ${metric("Temperature","♧",d.temp,"°C","temp",1)}
      ${metric("Humidity","♧",d.humidity,"%","humidity")}
      ${metric("Radon",icons.radon,d.radonShortTermAvg,"Bq/m³","radon")}

      ${
        d.pm25 !== undefined
        ? metric("PM2.5",icons.pm25,d.pm25,"µg/m³","pm25",1)
        : metric("Pressure",icons.pressure,d.pressure,"mbar","pressure")
      }
    </section>
  `;
}

async function loadDashboard() {
  try {
    const response = await fetch(
      "airthings-data.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Unable to load sensor data");
    }

    const data = await response.json();
    const devices = Object.values(data.devices || {});

    if (!devices.length) {
      throw new Error("No Airthings devices found");
    }

    document.getElementById("devices").innerHTML =
      devices.map(renderDevice).join("");

    if (data.updated) {
      const date = new Date(data.updated);
      document.getElementById("updated").textContent =
        "Last sensor update: " +
        (Number.isNaN(date.getTime())
          ? data.updated
          : date.toLocaleString("en-GB"));
    }

    document.getElementById("status").textContent =
      "Airthings data connected • " +
      devices.length + " devices";

  } catch (error) {
    document.getElementById("status").textContent =
      "Unable to update Airthings data: " + error.message;
  }
}

loadDashboard();
setInterval(loadDashboard, 60000);
</script>

</body>
</html>
